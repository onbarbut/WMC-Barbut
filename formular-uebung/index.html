<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formular-Übung – Stefan Barbut</title>
</head>
<body>
    <header>
        <h1>Anmeldung zum Gaming-Turnier</h1>
    </header>

    <main>
        <!-- mailto: öffnet den Mailclient, ?subject= setzt den Betreff -->
        <form action="mailto:stefan.barbut@outlook.com?subject=Anmeldung%20Gaming-Turnier" method="post" enctype="text/plain">

            <fieldset>
                <legend>Persönliche Daten</legend>

                <!-- Texteingabe (Pflichtfeld) -->
                <p>
                    <label for="vorname">Vorname:</label>
                    <input type="text" id="vorname" name="vorname" required>
                </p>
                <p>
                    <label for="nachname">Nachname:</label>
                    <input type="text" id="nachname" name="nachname" required>
                </p>

                <!-- Weiteres Eingabefeld: E-Mail (Pflichtfeld) -->
                <p>
                    <label for="email">E-Mail:</label>
                    <input type="email" id="email" name="email" placeholder="name@beispiel.at" required>
                </p>

                <!-- Pattern-Matching: Postleitzahl mit genau 4 Ziffern -->
                <p>
                    <label for="plz">Postleitzahl:</label>
                    <input type="text" id="plz" name="plz" pattern="[0-9]{4}" title="Genau 4 Ziffern, z. B. 1050" placeholder="1050" required>
                </p>

                <!-- Pattern-Matching: Telefonnummer -->
                <p>
                    <label for="telefon">Telefon:</label>
                    <input type="tel" id="telefon" name="telefon" pattern="\+?[0-9 ]{7,15}" title="7 bis 15 Ziffern, optional mit + am Anfang" placeholder="+43 660 1234567">
                </p>

                <!-- Weiteres Eingabefeld: Datum -->
                <p>
                    <label for="geburtsdatum">Geburtsdatum:</label>
                    <input type="date" id="geburtsdatum" name="geburtsdatum" required>
                </p>
            </fieldset>

            <fieldset>
                <legend>Turnier</legend>

                <!-- Radiobuttons -->
                <p>Erfahrung:</p>
                <p>
                    <input type="radio" id="anfaenger" name="erfahrung" value="Anfaenger" required>
                    <label for="anfaenger">Anfänger</label>
                    <input type="radio" id="fortgeschritten" name="erfahrung" value="Fortgeschritten">
                    <label for="fortgeschritten">Fortgeschritten</label>
                    <input type="radio" id="profi" name="erfahrung" value="Profi">
                    <label for="profi">Profi</label>
                </p>

                <!-- Dropdown -->
                <p>
                    <label for="spiel">Spiel:</label>
                    <select id="spiel" name="spiel" required>
                        <option value="">Bitte wählen</option>
                        <option value="League of Legends">League of Legends</option>
                        <option value="Valorant">Valorant</option>
                        <option value="Rocket League">Rocket League</option>
                        <option value="Geometry Dash">Geometry Dash</option>
                    </select>
                </p>

                <!-- Mehrfachauswahl -->
                <p>
                    <label for="rollen">Bevorzugte Rollen (Strg gedrückt halten für mehrere):</label><br>
                    <select id="rollen" name="rollen" multiple size="5">
                        <option value="Top">Top</option>
                        <option value="Jungle">Jungle</option>
                        <option value="Mid">Mid</option>
                        <option value="ADC">ADC</option>
                        <option value="Support">Support</option>
                    </select>
                </p>

                <!-- Weiteres Eingabefeld: Zahl -->
                <p>
                    <label for="teamgroesse">Teamgröße:</label>
                    <input type="number" id="teamgroesse" name="teamgroesse" min="1" max="5" value="1">
                </p>

                <!-- Checkboxen -->
                <p>Ausstattung:</p>
                <p>
                    <input type="checkbox" id="headset" name="ausstattung" value="Headset">
                    <label for="headset">Eigenes Headset</label>
                    <input type="checkbox" id="maus" name="ausstattung" value="Maus">
                    <label for="maus">Eigene Maus</label>
                    <input type="checkbox" id="tastatur" name="ausstattung" value="Tastatur">
                    <label for="tastatur">Eigene Tastatur</label>
                </p>
            </fieldset>

            <fieldset>
                <legend>Sonstiges</legend>

                <!-- Mehrzeiliges Textfeld -->
                <p>
                    <label for="nachricht">Nachricht:</label><br>
                    <textarea id="nachricht" name="nachricht" rows="5" cols="40" placeholder="Anmerkungen zur Anmeldung"></textarea>
                </p>

                <!-- Checkbox als Pflichtfeld -->
                <p>
                    <input type="checkbox" id="regeln" name="regeln" value="akzeptiert" required>
                    <label for="regeln">Ich akzeptiere die Turnierregeln.</label>
                </p>
            </fieldset>

            <p>
                <button type="submit">Abschicken</button>
                <button type="reset">Zurücksetzen</button>
            </p>
        </form>
    </main>
</body>
</html>
